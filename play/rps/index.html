<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Schere Stein Papier</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/style.css" />
  <link rel="stylesheet" href="../../assets/game-shell.css" />
</head>
<body>
  <div class="wrap">
    <div class="top-bar">
      <a class="back" href="../../index.html">← Arcade</a>
      <a class="py-link" href="https://github.com/Cynskzpt/pu-python-games/blob/main/sources/rock_paper_scissors2.py" target="_blank" rel="noopener">Python-Code</a>
    </div>
    <h1>✊ Schere Stein Papier</h1>
    <div class="game-frame" style="text-align:center;max-width:420px">
      <p id="result">Best of 3</p>
      <p class="score" id="scores">Du 0 : 0 PC</p>
      <div style="display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;margin:1rem 0">
        <button class="btn" data-c="rock">🪨 Stein</button>
        <button class="btn" data-c="paper">📄 Papier</button>
        <button class="btn" data-c="scissors">✂️ Schere</button>
      </div>
      <p id="detail" class="controls-hint"></p>
      <button class="btn" id="again" hidden>Nochmal</button>
    </div>
  </div>
  <script>
    const em={rock:"🪨",paper:"📄",scissors:"✂️"},win={rock:"scissors",paper:"rock",scissors:"paper"};
    let ps=0,cs=0,round=1,over=false;
    function reset(){ps=cs=0;round=1;over=false;document.getElementById("again").hidden=true;
      document.getElementById("result").textContent="Best of 3";update();}
    function update(){document.getElementById("scores").textContent=`Du ${ps} : ${cs} PC · Runde ${Math.min(round,3)}/3`;}
    document.querySelectorAll("[data-c]").forEach(btn=>btn.onclick=()=>{if(over)return;
      const p=btn.dataset.c,c=["rock","paper","scissors"][Math.floor(Math.random()*3)];
      let msg=`Du ${em[p]} vs ${em[c]} — `;
      if(p===c)msg+="Unentschieden";else if(win[p]===c){ps++;msg+="Du gewinnst!";}else{cs++;msg+="PC gewinnt!";}
      document.getElementById("detail").textContent=msg;round++;update();
      if(ps===2||cs===2||round>3){over=true;
        document.getElementById("result").textContent=ps>cs?"🏆 Du gewinnst!":ps<cs?"PC gewinnt!":"Gleichstand!";
        document.getElementById("again").hidden=false;}});
    document.getElementById("again").onclick=reset;reset();
  </script>
</body>
</html>
