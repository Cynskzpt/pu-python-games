<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reaction Time</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/style.css" />
  <link rel="stylesheet" href="../../assets/game-shell.css" />
</head>
<body>
  <div class="wrap">
    <div class="top-bar">
      <a class="back" href="../../index.html">← Arcade</a>
      <a class="py-link" href="https://github.com/Cynskzpt/pu-python-games/blob/main/sources/reaction_time_test.py" target="_blank" rel="noopener">Python-Code</a>
    </div>
    <h1>⚡ Reaction Time</h1>
    <div class="game-frame">
      <canvas id="c" width="360" height="400" style="cursor:pointer"></canvas>
      <p class="controls-hint" id="info">Klick zum Start · 5 Runden</p>
      <p class="score" id="avg"></p>
    </div>
  </div>
  <script>
    const c=document.getElementById("c"),x=c.getContext("2d");
    let state="idle",t0,timer,round=0,times=[];
    function draw(col,text){x.fillStyle=col;x.fillRect(0,0,360,400);x.fillStyle="#1a1a28";x.font="bold 22px Outfit";x.textAlign="center";x.fillText(text,180,200);}
    function startRound(){if(round>=5){const avg=Math.round(times.reduce((a,b)=>a+b,0)/times.length);
      draw("#111118","Fertig! Ø "+avg+" ms");document.getElementById("info").textContent="Klicken für neu";
      document.getElementById("avg").textContent="Best: "+Math.min(...times)+" ms";state="done";return;}
      state="wait";draw("#ff7878","Warte… nicht klicken!");clearTimeout(timer);
      timer=setTimeout(()=>{state="ready";t0=performance.now();draw("#78ffbe","JETZT klicken!");},1500+Math.random()*3000);}
    c.addEventListener("click",()=>{if(state==="done"){round=0;times=[];document.getElementById("avg").textContent="";startRound();return;}
      if(state==="idle"){round=0;times=[];startRound();return;}
      if(state==="wait"){clearTimeout(timer);state="early";draw("#a78bfa","Zu früh! Klick für neu");return;}
      if(state==="early"){startRound();return;}
      if(state==="ready"){const ms=Math.round(performance.now()-t0);times.push(ms);round++;
        document.getElementById("info").textContent=`Runde ${round}/5: ${ms} ms`;setTimeout(startRound,800);}});
    draw("#111118","Klick zum Start");state="idle";
  </script>
</body>
</html>
