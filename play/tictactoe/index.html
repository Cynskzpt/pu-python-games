<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic Tac Toe</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/style.css" />
  <link rel="stylesheet" href="../../assets/game-shell.css" />
</head>
<body>
  <div class="wrap">
    <div class="top-bar">
      <a class="back" href="../../index.html">← Arcade</a>
      <a class="py-link" href="https://github.com/Cynskzpt/pu-python-games/blob/main/sources/tic_tac_toe.py" target="_blank" rel="noopener">Python-Code</a>
    </div>
    <h1>❌ Tic Tac Toe</h1>
    <div class="game-frame">
      <p class="score" id="turn">Du bist X</p>
      <div id="board" style="display:grid;grid-template-columns:repeat(3,90px);gap:8px;margin:1rem 0"></div>
      <button class="btn" id="reset">Neu</button>
    </div>
  </div>
  <script>
    let b,turn,over;const lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    function init(){b=Array(9).fill("");turn="X";over=false;document.getElementById("turn").textContent="Du bist X";draw();}
    const win=p=>lines.some(l=>l.every(i=>b[i]===p));
    function ai(){const empty=b.map((v,i)=>v?-1:i).filter(i=>i>=0);
      for(const p of["O","X"])for(const i of empty){b[i]=p;if(win(p)){b[i]="";return i;}}
      if(empty.includes(4))return 4;return empty[Math.floor(Math.random()*empty.length)];}
    function draw(){const board=document.getElementById("board");board.innerHTML="";
      b.forEach((v,i)=>{const cell=document.createElement("button");cell.className="btn";
        cell.style.width=cell.style.height="90px";cell.style.fontSize="2rem";cell.textContent=v;
        cell.disabled=!!v||over||turn!=="X";cell.onclick=()=>{b[i]="X";
          if(win("X")){over=true;document.getElementById("turn").textContent="Du gewinnst! 🎉";draw();return;}
          if(b.every(c=>c)){document.getElementById("turn").textContent="Unentschieden";over=true;draw();return;}
          turn="O";document.getElementById("turn").textContent="Computer…";
          setTimeout(()=>{const m=ai();b[m]="O";
            if(win("O")){over=true;document.getElementById("turn").textContent="Computer gewinnt!";}
            else if(b.every(c=>c)){over=true;document.getElementById("turn").textContent="Unentschieden";}
            else{turn="X";document.getElementById("turn").textContent="Du bist X";}draw();},400);draw();};
        board.appendChild(cell);});}
    document.getElementById("reset").onclick=init;init();
  </script>
</body>
</html>
