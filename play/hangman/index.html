<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hangman</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/style.css" />
  <link rel="stylesheet" href="../../assets/game-shell.css" />
</head>
<body>
  <div class="wrap">
    <div class="top-bar">
      <a class="back" href="../../index.html">← Arcade</a>
      <a class="py-link" href="https://github.com/Cynskzpt/pu-python-games/blob/main/sources/Hangman.py" target="_blank" rel="noopener">Python-Code</a>
    </div>
    <h1>🪢 Hangman</h1>
    <div class="game-frame" style="width:100%;max-width:420px">
      <p id="word" style="font-size:1.8rem;letter-spacing:.35em;text-align:center;font-weight:700">_ _ _ _ _</p>
      <p class="controls-hint" id="status">Rate den Buchstaben (Englisch)</p>
      <div id="letters" style="display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;margin:1rem 0"></div>
      <button class="btn" id="new">Neues Wort</button>
    </div>
  </div>
  <script>
    const words=["strawberry","rainbow","kitten","marshmallow","cupcake","butterfly","sunshine","bubblegum","penguin","python"];
    let word,guessed,wrong,max=6;
    function init(){word=words[Math.floor(Math.random()*words.length)];guessed=new Set();wrong=0;
      document.getElementById("status").textContent="Falsch: 0 / "+max;renderWord();renderKeys();}
    function renderWord(){document.getElementById("word").textContent=[...word].map(c=>guessed.has(c)?c.toUpperCase():"_").join(" ");}
    function renderKeys(){const box=document.getElementById("letters");box.innerHTML="";
      for(let i=65;i<=90;i++){const ch=String.fromCharCode(i);const b=document.createElement("button");
        b.className="btn";b.style.padding="0.4rem .55rem";b.style.fontSize="0.85rem";b.textContent=ch;b.disabled=guessed.has(ch.toLowerCase());
        b.onclick=()=>guess(ch.toLowerCase(),b);box.appendChild(b);}}
    function guess(ch,btn){if(guessed.has(ch))return;guessed.add(ch);btn.disabled=true;
      if(!word.includes(ch))wrong++;document.getElementById("status").textContent="Falsch: "+wrong+" / "+max;renderWord();
      if([...word].every(c=>guessed.has(c)))document.getElementById("status").textContent="🎉 Gewonnen!";
      else if(wrong>=max)document.getElementById("status").textContent="Verloren! Wort: "+word;}
    document.getElementById("new").onclick=init;init();
  </script>
</body>
</html>
