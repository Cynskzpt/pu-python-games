<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flappy Bird</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/style.css" />
  <link rel="stylesheet" href="../../assets/game-shell.css" />
</head>
<body>
  <div class="wrap">
    <div class="top-bar">
      <a class="back" href="../../index.html">← Arcade</a>
      <a class="py-link" href="https://github.com/Cynskzpt/pu-python-games/blob/main/sources/flappy_bird.py" target="_blank" rel="noopener">Python-Code</a>
    </div>
    <h1>🐦 Flappy Bird</h1>
    <div class="game-frame">
      <span class="score" id="score">0</span>
      <canvas id="c" width="360" height="560"></canvas>
      <p class="controls-hint">Klick / Tippen / Leertaste</p>
    </div>
  </div>
  <script>
    const c=document.getElementById("c"),x=c.getContext("2d"),W=360,H=560,G=0.45,gap=150,pw=70;
    let bird,vel,pipes,score,active,best=+localStorage.getItem("flappyBest")||0;
    function reset(){bird={y:H/2,r:18};vel=0;pipes=[];score=0;active=true;for(let i=0;i<4;i++)addPipe(W+i*180);document.getElementById("score").textContent=0;}
    function addPipe(px){const top=80+Math.random()*(H-gap-160);pipes.push({x:px,top,scored:false});}
    function flap(){if(!active)reset();vel=-7.5;}
    function loop(){if(active){vel+=G;bird.y+=vel;pipes.forEach(p=>p.x-=3);if(pipes[pipes.length-1].x<W-180)addPipe(W);if(pipes[0].x<-pw)pipes.shift();
      pipes.forEach(p=>{if(!p.scored&&p.x+pw<70){p.scored=true;score++;document.getElementById("score").textContent=score;}
        if(p.x<70+bird.r&&p.x+pw>70-bird.r&&(bird.y-bird.r<p.top||bird.y+bird.r>p.top+gap))active=false;});
      if(bird.y+bird.r>H-50||bird.y-bird.r<0)active=false;if(!active){best=Math.max(best,score);localStorage.setItem("flappyBest",best);}}
      x.fillStyle="#c4ebff";x.fillRect(0,0,W,H);x.fillStyle="#b5ea9e";x.fillRect(0,H-50,W,50);
      pipes.forEach(p=>{x.fillStyle="#7dcc90";x.fillRect(p.x,0,pw,p.top);x.fillRect(p.x,p.top+gap,pw,H);});
      x.fillStyle="#ffdd78";x.beginPath();x.arc(70,bird.y,bird.r,0,Math.PI*2);x.fill();
      if(!active){x.fillStyle="rgba(0,0,0,0.5)";x.fillRect(0,0,W,H);x.fillStyle="#fff";x.font="bold 22px Outfit";x.textAlign="center";
        x.fillText("Game Over — tippen für neu",W/2,H/2);x.font="16px Outfit";x.fillText("Best: "+best,W/2,H/2+28);}
      requestAnimationFrame(loop);}
    c.addEventListener("click",flap);c.addEventListener("touchstart",e=>{e.preventDefault();flap();});
    document.addEventListener("keydown",e=>{if(e.code==="Space"){e.preventDefault();flap();}});
    reset();loop();
  </script>
</body>
</html>
