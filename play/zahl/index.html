<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zahl raten</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/style.css" />
  <link rel="stylesheet" href="../../assets/game-shell.css" />
</head>
<body>
  <div class="wrap">
    <div class="top-bar">
      <a class="back" href="../../index.html">← Arcade</a>
      <a class="py-link" href="https://github.com/Cynskzpt/pu-python-games/blob/main/sources/Zahl_raten.py" target="_blank" rel="noopener">Python-Code</a>
    </div>
    <h1>🔢 Zahl raten</h1>
    <div class="game-frame" style="width:100%;max-width:420px">
      <p class="controls-hint">Wie dein Python-Spiel: Zahl 1–100, 3 Versuche.</p>
      <p class="score" id="hint">Los!</p>
      <input type="number" id="guess" min="1" max="100" placeholder="Deine Zahl" style="width:100%;padding:.65rem;border-radius:.5rem;border:1px solid var(--border);background:rgba(0,0,0,.35);color:var(--text);font-family:inherit;font-size:1rem;margin-top:.5rem" />
      <button class="btn" id="go" style="margin-top:.75rem;width:100%">Raten</button>
      <button class="btn" id="new" style="margin-top:.5rem;width:100%" hidden>Neu</button>
    </div>
  </div>
  <script>
    let secret,tries,over;
    function init(){secret=Math.floor(Math.random()*100)+1;tries=3;over=false;
      document.getElementById("hint").textContent="3 Versuche — 1 bis 100";
      document.getElementById("guess").value="";document.getElementById("new").hidden=true;document.getElementById("go").disabled=false;}
    document.getElementById("go").onclick=()=>{if(over)return;const n=parseInt(document.getElementById("guess").value,10);
      if(isNaN(n)||n<1||n>100){document.getElementById("hint").textContent="Nur 1–100!";return;}tries--;
      if(n>secret)document.getElementById("hint").textContent=`Zu hoch! Noch ${tries} Versuch(e).`;
      else if(n<secret)document.getElementById("hint").textContent=`Zu niedrig! Noch ${tries} Versuch(e).`;
      else{document.getElementById("hint").textContent="🎉 Richtig!";over=true;end();return;}
      if(tries<=0){document.getElementById("hint").textContent=`Verloren. Zahl war ${secret}.`;over=true;end();}};
    function end(){document.getElementById("go").disabled=true;document.getElementById("new").hidden=false;}
    document.getElementById("new").onclick=init;
    document.getElementById("guess").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("go").click();});
    init();
  </script>
</body>
</html>
