<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/style.css" />
  <link rel="stylesheet" href="../../assets/game-shell.css" />
</head>
<body>
  <div class="wrap">
    <div class="top-bar">
      <a class="back" href="../../index.html">← Arcade</a>
      <a class="py-link" href="https://github.com/Cynskzpt/pu-python-games/blob/main/sources/snake_game.py" target="_blank" rel="noopener">Python-Code</a>
    </div>
    <h1>🐍 Snake</h1>
    <div class="game-frame">
      <span class="score" id="score">0</span>
      <canvas id="c" width="400" height="400"></canvas>
      <p class="controls-hint">Pfeiltasten / Wischen · Leertaste = neu</p>
    </div>
  </div>
  <script>
    const canvas=document.getElementById("c"),ctx=canvas.getContext("2d"),S=20,W=400,cols=W/S;
    let snake,dir,food,score,dead,tick;
    function reset(){snake=[{x:10,y:10}];dir={x:1,y:0};food=spawn();score=0;dead=false;document.getElementById("score").textContent=0;clearInterval(tick);tick=setInterval(step,110);}
    function spawn(){let f;do{f={x:Math.floor(Math.random()*cols),y:Math.floor(Math.random()*cols)};}while(snake.some(s=>s.x===f.x&&s.y===f.y));return f;}
    function step(){if(dead)return;const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.y<0||h.x>=cols||h.y>=cols||snake.some(s=>s.x===h.x&&s.y===h.y)){dead=true;clearInterval(tick);draw();return;}
      snake.unshift(h);if(h.x===food.x&&h.y===food.y){score++;document.getElementById("score").textContent=score;food=spawn();}else snake.pop();draw();}
    function draw(){ctx.fillStyle="#111118";ctx.fillRect(0,0,W,W);ctx.fillStyle=dead?"#ff6b6b":"#00cc66";
      snake.forEach((s,i)=>{ctx.globalAlpha=1-i*0.03;ctx.fillRect(s.x*S,s.y*S,S-1,S-1);});ctx.globalAlpha=1;
      ctx.fillStyle="#ff6bcb";ctx.fillRect(food.x*S,food.y*S,S-1,S-1);
      if(dead){ctx.fillStyle="#fff";ctx.font="bold 28px Outfit";ctx.textAlign="center";ctx.fillText("Game Over — Leertaste",W/2,W/2);}}
    document.addEventListener("keydown",e=>{if(e.key===" ")reset();
      if(e.key==="ArrowUp"&&dir.y!==1)dir={x:0,y:-1};if(e.key==="ArrowDown"&&dir.y!==-1)dir={x:0,y:1};
      if(e.key==="ArrowLeft"&&dir.x!==1)dir={x:-1,y:0};if(e.key==="ArrowRight"&&dir.x!==-1)dir={x:1,y:0};});
    let tx0,ty0;canvas.addEventListener("touchstart",e=>{tx0=e.touches[0].clientX;ty0=e.touches[0].clientY;});
    canvas.addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-tx0,dy=e.changedTouches[0].clientY-ty0;
      if(Math.abs(dx)>Math.abs(dy)){if(dx>20&&dir.x!==-1)dir={x:1,y:0};if(dx<-20&&dir.x!==1)dir={x:-1,y:0};}
      else{if(dy>20&&dir.y!==-1)dir={x:0,y:1};if(dy<-20&&dir.y!==1)dir={x:0,y:-1};}});
    reset();
  </script>
</body>
</html>
