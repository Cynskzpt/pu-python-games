<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pac-Man</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/style.css" />
  <link rel="stylesheet" href="../../assets/game-shell.css" />
</head>
<body>
  <div class="wrap">
    <div class="top-bar">
      <a class="back" href="../../index.html">← Arcade</a>
      <a class="py-link" href="https://github.com/Cynskzpt/pu-python-games/blob/main/sources/pacman.py" target="_blank" rel="noopener">Python-Code</a>
    </div>
    <h1>👻 Pac-Man</h1>
    <div class="game-frame">
      <span class="score" id="score">0</span>
      <canvas id="c" width="380" height="420"></canvas>
      <p class="controls-hint">Pfeiltasten</p>
    </div>
  </div>
  <script>
    const c=document.getElementById("c"),x=c.getContext("2d");
    const map=["11111111111111111","10101010101010101","11111111111111111","10000011100000001","10111110111110101","10100100010010101","11110111111011111","00010100010100000","11110111111011111","10100000000000101","10111111111110101","10000011100000001","11111111111111111"];
    const R=13,C=17,cell=20;let pac={r:6,c:8,dir:{r:0,c:0},next:{r:0,c:0}},ghosts,dots,score;
    function initDots(){dots=[];for(let r=0;r<R;r++)for(let c2=0;c2<C;c2++)if(map[r][c2]==="0")dots.push(r+","+c2);}
    function reset(){initDots();score=0;pac={r:6,c:8,dir:{r:0,c:0},next:{r:0,c:0}};
      ghosts=[{r:5,c:8,col:"#ff6b6b"},{r:6,c:7,col:"#00f5d4"},{r:6,c:9,col:"#ffb8f0"}];
      document.getElementById("score").textContent=0;}
    const wall=(r,c)=>r<0||c<0||r>=R||c>=C||map[r][c]==="1";
    function move(ent,isPac){const d=isPac?(pac.next.r||pac.next.c?pac.next:pac.dir):ent.dir;
      const nr=ent.r+d.r,nc=ent.c+d.c;if(!wall(nr,nc)){ent.r=nr;ent.c=nc;if(isPac)pac.dir=d;}
      else if(!isPac)ent.dir=[{r:1,c:0},{r:-1,c:0},{r:0,c:1},{r:0,c:-1}][Math.floor(Math.random()*4)];}
    function step(){move(pac,true);ghosts.forEach(g=>{if(Math.random()<0.08)g.dir=[{r:1,c:0},{r:-1,c:0},{r:0,c:1},{r:0,c:-1}][Math.floor(Math.random()*4)];move(g,false);
      if(Math.abs(g.r-pac.r)+Math.abs(g.c-pac.c)<1.2)reset();});
      const key=pac.r+","+pac.c,i=dots.indexOf(key);if(i>=0){dots.splice(i,1);score+=10;document.getElementById("score").textContent=score;if(!dots.length)reset();}
      draw();}
    function draw(){x.fillStyle="#0a0a12";x.fillRect(0,0,380,420);
      for(let r=0;r<R;r++)for(let c2=0;c2<C;c2++)if(map[r][c2]==="1"){x.fillStyle="#1e3a8a";x.fillRect(c2*cell,r*cell+10,cell,cell);}
      x.fillStyle="#ffe566";dots.forEach(d=>{const[r,c2]=d.split(",");x.beginPath();x.arc(c2*cell+cell/2,r*cell+10+cell/2,3,0,7);x.fill();});
      x.fillStyle="#ffe566";x.beginPath();x.arc(pac.c*cell+cell/2,pac.r*cell+10+cell/2,9,0.2*Math.PI,1.8*Math.PI);x.lineTo(pac.c*cell+cell/2,pac.r*cell+10+cell/2);x.fill();
      ghosts.forEach(g=>{x.fillStyle=g.col;x.beginPath();x.arc(g.c*cell+cell/2,g.r*cell+10+cell/2,8,0,Math.PI*2);x.fill();});}
    document.addEventListener("keydown",e=>{const m={ArrowUp:{r:-1,c:0},ArrowDown:{r:1,c:0},ArrowLeft:{r:0,c:-1},ArrowRight:{r:0,c:1}};if(m[e.key])pac.next=m[e.key];});
    reset();setInterval(step,140);
  </script>
</body>
</html>
