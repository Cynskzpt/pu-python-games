<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spiel lädt…</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600&display=swap" rel="stylesheet" />
  <style>
    body { margin: 0; background: #0a0a0f; font-family: Outfit, sans-serif; color: #f4f4f8; }
    .bar {
      display: flex; align-items: center; gap: 1rem;
      padding: 0.65rem 1rem;
      background: rgba(255,255,255,0.06);
      border-bottom: 1px solid rgba(255,255,255,0.12);
    }
    .bar a { color: #00f5d4; text-decoration: none; font-weight: 600; }
    iframe { width: 100%; height: calc(100vh - 48px); border: none; display: block; }
  </style>
</head>
<body>
  <div class="bar">
    <a href="../index.html">← Arcade</a>
    <span id="title">Python Game</span>
  </div>
  <iframe id="game" title="Python Spiel"></iframe>
  <script>
    const id = new URLSearchParams(location.search).get("g") || "snake";
    document.getElementById("title").textContent = id;
    document.getElementById("game").src = id + "/index.html";
  </script>
</body>
</html>
